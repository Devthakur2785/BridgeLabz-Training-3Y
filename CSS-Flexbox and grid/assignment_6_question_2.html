<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="card">
            <h2>Laptop</h2>
            <p class="price">₹55,000</p>
        </div>

        <div class="card">
            <h2>Smartphone</h2>
            <p class="price">₹25,000</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p class="price">₹2,500</p>
        </div>

        <div class="card">
            <h2>Smart Watch</h2>
            <p class="price">₹4,000</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p class="price">₹1,500</p>
        </div>

        <div class="card">
            <h2>Mouse</h2>
            <p class="price">₹800</p>
        </div>

        <div class="card">
            <h2>Monitor</h2>
            <p class="price">₹15,000</p>
        </div>

        <div class="card">
            <h2>Speaker</h2>
            <p class="price">₹3,000</p>
        </div>

    </div>

</body>
</html>
