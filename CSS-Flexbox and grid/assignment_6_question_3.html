<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: #222;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
        }

        .box {
            flex: 1;
            max-width: 300px;
            min-height: 200px;
            background: #f2f2f2;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        /* Footer */
        footer {
            width: 100%;
            background: #222;
            color: white;
            text-align: center;
            padding: 18px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 100%;
                max-width: 400px;
            }

            nav {
                flex-wrap: wrap;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="box">
            <h2>Services</h2>
        </div>

        <div class="box">
            <h2>Projects</h2>
        </div>

        <div class="box">
            <h2>Contact</h2>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Homepage. All Rights Reserved.</p>
    </footer>

</body>
</html>
