<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .card-container {
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .front {
            background: white;
        }

        .front img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .back {
            background: #222;
            color: white;
            transform: rotateY(180deg);
        }

        .back p {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card-container">
        <div class="card">

            <div class="side front">
                <img src="https://picsum.photos/220" alt="Random Image">
                <h2>My Card</h2>
            </div>

            <div class="side back">
                <h2>About This Card</h2>
                <p>
                    This is the back side of the card. Hover over the card
                    to see the 180-degree flip animation.
                </p>
            </div>

        </div>
    </div>

</body>
</html>
