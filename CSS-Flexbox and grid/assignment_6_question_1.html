<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Jaisawat - Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #222;
            color: white;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 50px 8%;
        }

        .about,
        .image-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .about h1 {
            margin-bottom: 15px;
        }

        .about p {
            max-width: 500px;
            line-height: 1.6;
        }

        .image-section img {
            width: 300px;
            max-width: 100%;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #222;
            color: white;
        }

        @media (max-width: 700px) {
            header,
            main {
                flex-direction: column;
            }

            header {
                gap: 15px;
            }

            main {
                gap: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Dev Jaisawat</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="about">
            <h1>About Me</h1>
            <p>
                Hello! I am Dev Jaisawat, a passionate student interested in
                web development and programming. I enjoy learning new
                technologies and creating simple, useful projects.
            </p>
        </section>

        <section class="image-section">
            <img src="https://via.placeholder.com/300" alt="Profile Image">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dev Jaisawat. All Rights Reserved.</p>
    </footer>

</body>
</html>
