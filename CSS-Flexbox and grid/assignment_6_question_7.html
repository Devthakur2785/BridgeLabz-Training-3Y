<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .circle {
            width: 18px;
            height: 18px;
            background: #222;
            border-radius: 50%;
            animation: bounce 0.8s ease-in-out infinite;
        }

        .circle:nth-child(2) {
            animation-delay: 0.15s;
        }

        .circle:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>

    <div class="loader">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

</body>
</html>
