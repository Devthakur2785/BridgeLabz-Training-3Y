<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="Q3-image-showcase.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over the images to see the effect.</p>
    </header>

    <main class="gallery">

        <figure class="image-card">
            <div class="image-container">
                <img src="images/image1.jpg" alt="Nature Image">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-container">
                <img src="images/image2.jpg" alt="Mountain Image">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-container">
                <img src="images/image3.jpg" alt="Beach Image">
                <div class="overlay"></div>
            </div>
            <figcaption>Peaceful Beach</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-container">
                <img src="images/image4.jpg" alt="Forest Image">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-container">
                <img src="images/image5.jpg" alt="City Image">
                <div class="overlay"></div>
            </div>
            <figcaption>City Lights</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-container">
                <img src="images/image6.jpg" alt="Sunset Image">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Sunset</figcaption>
        </figure>

    </main>

</body>
</html>
