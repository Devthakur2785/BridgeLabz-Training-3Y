<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="Q2-tooltip.css">
</head>
<body>

    <main class="container">

        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over each element to see the tooltip.</p>

        <div class="tooltip-container">

            <div class="tooltip-box">
                <span class="icon">💡</span>
                <span class="tooltip-text">This is an Idea</span>
            </div>

            <div class="tooltip-box">
                <span class="word">HTML</span>
                <span class="tooltip-text">HyperText Markup Language</span>
            </div>

            <div class="tooltip-box">
                <span class="word">CSS</span>
                <span class="tooltip-text">Cascading Style Sheets</span>
            </div>

            <div class="tooltip-box">
                <span class="icon">⭐</span>
                <span class="tooltip-text">This is a Star</span>
            </div>

        </div>

    </main>

</body>
</html>
