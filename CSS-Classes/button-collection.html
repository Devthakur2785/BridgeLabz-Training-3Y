<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <link rel="stylesheet" href="Q5-button-collection.css">
</head>
<body>

    <main class="container">

        <h1>Styled Button Collection</h1>

        <div class="button-container">

            <button class="btn primary">
                Primary Button
            </button>

            <button class="btn secondary">
                Secondary Button
            </button>

            <button class="btn outline">
                Outline Button
            </button>

            <button class="btn disabled" disabled>
                Disabled Button
            </button>

        </div>

        <p>
            Hover over the buttons and click to see different effects.
        </p>

    </main>

</body>
</html>
