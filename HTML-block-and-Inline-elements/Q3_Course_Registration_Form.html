<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q3 - Course Registration Form</title>
</head>
<body>

    <header>
        <h1>Course Registration Form</h1>
    </header>

    <main>
        <form>

            <!-- Personal Details grouped using fieldset -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
            </fieldset>

            <br>

            <!-- Course Selection grouped using fieldset -->
            <fieldset>
                <legend>Course Selection</legend>

                <label for="course">Choose a Course:</label>
                <select id="course" name="course">
                    <option value="html">Web Development - HTML/CSS</option>
                    <option value="python">Python Programming</option>
                    <option value="java">Java Programming</option>
                    <option value="dsa">Data Structures &amp; Algorithms</option>
                    <option value="dbms">Database Management Systems</option>
                </select>
            </fieldset>

            <br>

            <input type="submit" value="Register">

        </form>

        <!-- Course Schedule Table -->
        <h2>Available Course Schedules</h2>
        <table border="1" cellpadding="8">
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 11:30 AM</td>
                <td>Dr. Rahul Sharma</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>1:00 PM - 2:30 PM</td>
                <td>Ms. Priya Verma</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>3:00 PM - 4:30 PM</td>
                <td>Mr. Anil Kumar</td>
            </tr>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 Course Registration Portal.</p>
    </footer>

</body>
</html>
