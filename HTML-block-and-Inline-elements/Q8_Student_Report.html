<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - Student Report Page</title>
</head>
<body>

    <!-- School name -->
    <h1>Green Valley Public School</h1>
    <h2>Student Report Card</h2>

    <table border="1" cellpadding="8">

        <!-- Table header with title attribute for extra clarity -->
        <tr>
            <th colspan="2" title="Subject-wise marks obtained by the student">Subject Marks</th>
        </tr>
        <tr>
            <th>Subject</th>
            <th title="Marks out of 100">Marks Obtained</th>
        </tr>

        <!-- Subject rows -->
        <tr>
            <td>English</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>92</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Social Science</td>
            <td>79</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
        </tr>

        <!-- Total and Percentage row using rowspan/colspan for clarity -->
        <tr>
            <td rowspan="2" title="Overall performance summary">Summary</td>
            <td title="Sum of marks in all five subjects">Total: 439 / 500</td>
        </tr>
        <tr>
            <td title="Percentage calculated from total marks">Percentage: 87.8%</td>
        </tr>

    </table>

</body>
</html>
