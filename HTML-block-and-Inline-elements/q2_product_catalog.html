<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>
<body>

    <header>
        <h1>Online Store - Product Catalog</h1>
    </header>

    <table border="1">
        <tr>
            <th colspan="2">Product</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Laptop"></td>
            <td>Laptop</td>
            <td>Powerful laptop for study and work.</td>
            <td>₹55,000</td>
            <td rowspan="2">In Stock</td>
        </tr>

        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Headphones"></td>
            <td>Headphones</td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,500</td>
        </tr>

        <tr>
            <td><img src="https://via.placeholder.com/100" alt="Keyboard"></td>
            <td>Keyboard</td>
            <td>Comfortable keyboard for everyday use.</td>
            <td>₹1,200</td>
            <td>Out of Stock</td>
        </tr>
    </table>

</body>
</html>
