<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q6 - Table Filter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    #searchBox { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #2d6cdf; color: #fff; }
    .hidden { display: none; }
    #noResultsRow td { text-align: center; color: #b00; font-style: italic; }
  </style>
</head>
<body>
  <h2>Student Records</h2>
  <input type="text" id="searchBox" placeholder="Search by name, branch or CGPA...">
  <table>
    <thead>
      <tr><th>Name</th><th>Branch</th><th>CGPA</th></tr>
    </thead>
    <tbody id="studentTableBody">
      <tr><td>Aarav Sharma</td><td>Computer Science</td><td>8.7</td></tr>
      <tr><td>Priya Verma</td><td>Electronics</td><td>9.1</td></tr>
      <tr><td>Rohan Gupta</td><td>Mechanical</td><td>7.8</td></tr>
      <tr><td>Sneha Iyer</td><td>Computer Science</td><td>9.4</td></tr>
      <tr><td>Karan Mehta</td><td>Civil</td><td>8.2</td></tr>
      <tr><td>Anjali Singh</td><td>Electrical</td><td>8.9</td></tr>
      <tr id="noResultsRow" class="hidden"><td colspan="3">No results found</td></tr>
    </tbody>
  </table>
  <script>
// Q6: Real-time table filter using the "input" event

const searchBox = document.getElementById("searchBox");
const studentRows = document.querySelectorAll("#studentTableBody tr:not(#noResultsRow)");
const noResultsRow = document.getElementById("noResultsRow");

// The "input" event fires on every keystroke, paste, or deletion
searchBox.addEventListener("input", () => {
  const searchText = searchBox.value.trim().toLowerCase(); // lower-case => case-insensitive
  let visibleRowCount = 0;

  studentRows.forEach((row) => {
    // Compare against the whole row (name + branch + CGPA)
    const rowText = row.textContent.toLowerCase();
    const isMatch = rowText.includes(searchText); // empty search matches every row

    row.classList.toggle("hidden", !isMatch);
    if (isMatch) visibleRowCount++;
  });

  // Show the message only when nothing matched
  noResultsRow.classList.toggle("hidden", visibleRowCount > 0);
});

  </script>
</body>
</html>
