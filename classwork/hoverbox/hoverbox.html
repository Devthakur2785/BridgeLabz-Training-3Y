<!DOCTYPE html>
<html>

<head>
    <title>Links</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 500px;
            margin: 50px auto;
            border: 1px solid #ddd;
            border-radius: 25px;
            overflow: hidden;
            text-align: center;
        }

        .title {
            background-color: #a8e6ed;
            padding: 40px;
            font-size: 50px;
            font-weight: bold;
        }

        .link {
            padding: 45px;
            font-size: 35px;
            border-top: 1px solid #ccc;
            background-color: white;
        }

        .link:hover {
            background-color: rgb(11, 208, 11);
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="title">Links</div>

        <div class="link">Home</div>

        <div class="link">About</div>

        <div class="link">Services</div>

        <div class="link">Contact</div>

    </div>

</body>

</html>
