<!DOCTYPE html>
<html>

<head>
    <title>Student Portfolio</title>

    <style>
        body {
            background-color: #f5f5dc;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fffde7;
            border-radius: 20px;
            box-shadow: 0 4px 15px gray;
        }

        .profile {
            width: 120px;
            height: 120px;
            background-color: #e6d9a8;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile p {
            font-size: 20px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 5px;
        }

        h3 {
            margin-top: 5px;
        }

        .about {
            margin: 30px 20px;
            line-height: 1.6;
        }

        .skills {
            font-weight: bold;
            margin: 20px;
        }

        .button {
            background-color: #4da3df;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #2585c5;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">
            <p>Student</p>
        </div>

        <h1>Dev Jaisawat</h1>

        <h3>Computer Science Engineering</h3>

        <p>GLA UNIVERSITY</p>

        <div class="about">
            I am a passionate Computer Science student
            interested in Web Development, Java, and
            problem solving.
        </div>

        <h2>Skills</h2>

        <div class="skills">
            HTML &nbsp; CSS &nbsp; Java &nbsp; Problem Solving
        </div>

        <button class="button">Contact Me</button>

    </div>

</body>

</html>
