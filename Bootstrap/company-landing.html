<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech - Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Q1-company-landing.css">
</head>

<body>

    <!-- Header -->
    <header>

        <!-- Bootstrap navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">
                    NovaTech
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>

    </header>

    <!-- Main content -->
    <main>

        <!-- Hero section -->
        <section class="hero py-5">

            <div class="container">

                <!-- Bootstrap row and column -->
                <div class="row align-items-center min-vh-75">

                    <div class="col-lg-7 text-center text-lg-start">

                        <h1 class="display-3 fw-bold">
                            Build Your Future With NovaTech
                        </h1>

                        <p class="lead my-4">
                            We create simple, powerful and modern digital
                            solutions that help businesses grow faster.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg">
                            Get Started
                        </a>

                    </div>

                    <div class="col-lg-5 text-center mt-4 mt-lg-0">

                        <div class="hero-box">
                            <h2>Smart Solutions</h2>
                            <p>
                                Technology designed for modern businesses.
                            </p>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 NovaTech. All Rights Reserved.
        </p>
    </footer>

    <!-- Bootstrap JS required for responsive navbar -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
