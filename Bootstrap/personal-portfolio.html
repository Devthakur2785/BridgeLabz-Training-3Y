<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Siddharth Singh - Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Q2-personal-portfolio.css">
</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="bg-dark text-white text-center p-5">

        <h1 class="fw-bold">
            Siddharth Singh
        </h1>

        <p class="lead mb-0">
            Computer Science Student | Developer
        </p>

    </header>

    <!-- Main portfolio -->
    <main>

        <section class="container text-center mt-4 mb-5">

            <!-- Profile image -->
            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
                alt="Profile Photo"
                class="img-fluid rounded-circle profile-img">

            <h2 class="mt-4 fw-bold">
                Hello, I'm Siddharth
            </h2>

            <p class="text-muted">
                I am a Computer Science student interested in software
                development, problem solving and modern web technologies.
            </p>

            <!-- Buttons -->
            <div class="mt-4">

                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>

            </div>

        </section>

        <!-- Contact section -->
        <section class="container mb-5">

            <div class="row justify-content-center">

                <div class="col-md-7">

                    <div class="bg-white p-5 shadow-sm rounded">

                        <h3 class="text-center fw-bold mb-4">
                            Contact Me
                        </h3>

                        <form>

                            <div class="mb-3">
                                <label class="form-label">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Message
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="4"
                                    placeholder="Write your message">
                                </textarea>
                            </div>

                            <button class="btn btn-dark w-100">
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">
            © 2026 Siddharth Singh
        </p>
    </footer>

</body>
</html>
