<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore - Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Q3-product-catalog.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">

        <h1 class="fw-bold">
            TechStore
        </h1>

        <p class="mb-0">
            Quality products for modern technology lovers
        </p>

    </header>

    <main>

        <section class="container py-5">

            <h2 class="text-center fw-bold mb-5">
                Featured Products
            </h2>

            <!-- Bootstrap row -->
            <div class="row g-4">

                <!-- Product 1 -->
                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100 shadow-sm">

                        <img
                            src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=500&q=80"
                            class="card-img-top"
                            alt="Laptop">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Laptop Pro
                            </h5>

                            <p class="fw-bold text-primary">
                                ₹65,999
                            </p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Product 2 -->
                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100 shadow-sm">

                        <img
                            src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
                            class="card-img-top"
                            alt="Smartphone">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                SmartPhone X
                            </h5>

                            <p class="fw-bold text-primary">
                                ₹29,999
                            </p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Product 3 -->
                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100 shadow-sm">

                        <img
                            src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                            class="card-img-top"
                            alt="Smart Watch">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Smart Watch
                            </h5>

                            <p class="fw-bold text-primary">
                                ₹4,999
                            </p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Product 4 -->
                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100 shadow-sm">

                        <img
                            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                            class="card-img-top"
                            alt="Headphones">

                        <div class="card-body text-center">

                            <h5 class="card-title">
                                Wireless Headphones
                            </h5>

                            <p class="fw-bold text-primary">
                                ₹2,499
                            </p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 TechStore
        </p>

    </footer>

</body>
</html>
