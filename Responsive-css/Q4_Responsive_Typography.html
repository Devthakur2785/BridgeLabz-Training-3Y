<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Responsive Typography</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .typography-section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 48px 36px;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 3rem);
      margin: 0 0 24px;
      line-height: 1.2;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      margin: 0 auto;
      max-width: 760px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .typography-section {
        margin: 20px auto;
        padding: 28px 18px;
      }

      h1 {
        margin-bottom: 18px;
        line-height: 1.25;
      }

      p {
        line-height: 1.7;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="typography-section">
      <h1>Responsive Typography</h1>
      <p>
        This section demonstrates how text automatically scales across screen
        sizes using relative units and the CSS clamp() function. The heading
        and paragraph remain readable on desktops, tablets, and mobile devices.
      </p>
    </section>
  </main>
</body>
</html>
