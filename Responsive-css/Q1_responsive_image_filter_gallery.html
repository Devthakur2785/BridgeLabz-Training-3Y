<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 32px 18px;
  font-family: Arial, sans-serif;
  color: #202124;
  background: #f3f5f7;
}

.gallery-container {
  max-width: 1100px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 10px;
  text-align: center;
}

.intro {
  margin: 0 auto 28px;
  max-width: 650px;
  text-align: center;
  line-height: 1.5;
  color: #555;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 22px;
}

.card {
  margin: 0;
  overflow: hidden;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
}

.card img {
  display: block;
  width: 100%;
  height: 210px;
  object-fit: cover;
  transition: filter 0.6s ease, transform 0.6s ease;
}

.card:hover img {
  filter: none;
  transform: scale(1.03);
}

figcaption {
  padding: 13px 12px;
  text-align: center;
  font-weight: 700;
}

/* Different filter effects */
.blur {
  filter: blur(3px);
}

.grayscale {
  filter: grayscale(100%);
}

.sepia {
  filter: sepia(100%);
}

.brightness {
  filter: brightness(1.55);
}

.contrast {
  filter: contrast(180%);
}

.hue {
  filter: hue-rotate(140deg);
}

/* On narrow screens, show all images in one column */
@media (max-width: 599px) {
  .gallery {
    grid-template-columns: 1fr;
  }

  .card img {
    height: 230px;
  }
}

  </style>
</head>
<body>
  <main class="gallery-container">
    <h1>Responsive Image Filter Gallery</h1>
    <p class="intro">Explore six images with different CSS filter effects. Hover over an image to see its original colors.</p>

    <section class="gallery" aria-label="Image filter gallery">
      <figure class="card">
        <img class="blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake surrounded by green hills">
        <figcaption>Blur</figcaption>
      </figure>

      <figure class="card">
        <img class="grayscale" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Open landscape beneath a wide sky">
        <figcaption>Grayscale</figcaption>
      </figure>

      <figure class="card">
        <img class="sepia" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Golden sunrise over a field">
        <figcaption>Sepia</figcaption>
      </figure>

      <figure class="card">
        <img class="brightness" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snow-covered mountain peaks">
        <figcaption>Brightness</figcaption>
      </figure>

      <figure class="card">
        <img class="contrast" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight shining through a forest">
        <figcaption>Contrast</figcaption>
      </figure>

      <figure class="card">
        <img class="hue" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Lake and mountains in a scenic valley">
        <figcaption>Hue Rotate</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
