<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
    <h1>Login</h1>

    <form action="#" method="post">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!--
            A CSRF (Cross-Site Request Forgery) token is a hidden, unique
            value generated by the server and included in the form.
            When the form is submitted, the server checks that the token
            matches the one it issued. This confirms the request came from
            the legitimate site itself (not from a malicious site tricking
            the user's browser into submitting the form), helping prevent
            CSRF attacks.
        -->
        <input type="hidden" name="csrf_token" value="dummyCSRFTokenValue123456">

        <input type="submit" value="Login">
    </form>
</body>
</html>
