<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded YouTube Video</title>
</head>
<body>
    <h1>My Favorite YouTube Video</h1>

    <!-- Width and height are set in percentages so the video
         resizes responsively when the browser window is resized -->
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="60%"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>
</body>
</html>
