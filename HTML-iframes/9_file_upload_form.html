<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>
    <h1>Upload a Picture</h1>

    <form action="#" method="post" enctype="multipart/form-data">
        <label for="picture">Choose a file:</label><br>
        <input type="file" id="picture" name="picture" accept=".jpg,.jpeg,.png"><br><br>

        <input type="submit" value="Upload">
    </form>

    <p>Note: Only JPG and PNG image files are allowed for upload.</p>
</body>
</html>
