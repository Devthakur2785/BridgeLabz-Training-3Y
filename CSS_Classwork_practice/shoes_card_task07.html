<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Running Shoes Card</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f3f3;
    font-family: Arial, Helvetica, sans-serif;
}

.card {
    width: 410px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
}

.top {
    height: 321px;
    position: relative;
    overflow: hidden;
    background: #e90012;
}

.top img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.offer {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 8px 16px;
    border-radius: 24px;
    background: #ff0808;
    color: white;
    font-size: 19px;
    font-weight: 700;
}

.fav {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    line-height: 1;
    color: #111;
}

.info {
    padding: 40px 25px 25px;
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.category {
    align-self: flex-start;
    background: #3971d5;
    color: white;
    font-size: 20px;
    padding: 1px 3px;
}

.title {
    align-self: flex-start;
    background: #3971d5;
    color: white;
    font-size: 26px;
    line-height: 30px;
    font-weight: 700;
    padding: 1px 3px;
}

.rating {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 30px;
}

.stars {
    color: #f5bd20;
    font-size: 24px;
    letter-spacing: 1px;
}

.reviews {
    color: #777;
    font-size: 19px;
}

.price-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-top: 3px;
}

.price {
    font-size: 30px;
    font-weight: 700;
    color: #111;
}

.old-price {
    font-size: 18px;
    color: #777;
}

.cart {
    width: 100%;
    height: 55px;
    margin-top: 7px;
    border: 0;
    border-radius: 11px;
    background: #000;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
}
</style>
</head>
