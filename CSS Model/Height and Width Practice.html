```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main>
        <section class="container">

            <div class="box box1">
                <h2>Box 1</h2>
                <p>Width: 200px</p>
                <p>Height: 150px</p>
            </div>

            <div class="box box2">
                <h2>Box 2</h2>
                <p>Width: 30%</p>
                <p>Height: 20vh</p>
            </div>

            <div class="box box3">
                <h2>Box 3</h2>
                <p>Width: 15em</p>
                <p>Uses min-height and overflow</p>
                <p>
                    This is extra content used to demonstrate
                    the overflow property.
                </p>
            </div>

        </section>
    </main>

    <footer>
        <p>Height and Width CSS Practice</p>
    </footer>

</body>
</html>
