
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fixed header -->
    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>

        <!-- Linear gradient section -->
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>
                A linear gradient changes colors along a straight line.
            </p>
        </section>

        <!-- Radial gradient section -->
        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>
                A radial gradient starts from a central point.
            </p>
        </section>

    </main>

    <!-- Fixed footer -->
    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
